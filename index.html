<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alan Singh – Web Developer</title>
<meta name="description" content="Portfolio of Alan Singh, BCA graduate with web development and database experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#14202e; --muted:#566376; --line:#d9dfe7;
  --accent:#2a45f0; --accent-ink:#ffffff; --soft:#e6eaff;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#152033; --ink:#e8edf5; --muted:#9aa8bc; --line:#26334a;
  --accent:#8ea2ff; --accent-ink:#0d1420; --soft:#1c2a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:36px}
.muted{color:var(--muted)}

/* NAV */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:-.02em}
.links{display:flex;gap:4px;align-items:center;list-style:none}
.links a{display:block;padding:8px 12px;border-radius:999px;text-decoration:none;font-size:.95rem;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.links a:hover{color:var(--ink)}
.links a.active{background:var(--soft);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 .98rem var(--body);text-decoration:none;cursor:pointer;transition:transform .15s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 16px;font-size:.9rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
#menuBtn{display:none}

/* HERO */
.hero{padding:96px 0 72px}
.hero h1{font-size:clamp(3.2rem,11vw,7.5rem);font-weight:800;letter-spacing:-.045em;line-height:.95}
.hero h1 span{display:block;color:var(--accent)}
.hero .title{font-family:var(--display);font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:500;margin-top:28px}
.hero p.intro{max-width:56ch;margin-top:16px;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.socials{display:flex;gap:18px;margin-top:28px;flex-wrap:wrap}
.socials a{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;transition:text-decoration-color .2s}
.socials a:hover{text-decoration-color:var(--accent)}
.hero-photo{width:132px;height:132px;border-radius:50%;object-fit:cover;margin-bottom:28px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}

/* ABOUT / SKILLS */
.about p{max-width:62ch;margin-bottom:16px}
.about .goal{border-left:4px solid var(--accent);padding-left:18px;margin-top:24px}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card h3{font-size:1.15rem;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:999px;background:var(--soft);font-size:.87rem;font-weight:500}

/* PROJECTS */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.proj{display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s}
.proj:hover{transform:translateY(-4px);border-color:var(--accent)}
.proj img{width:100%;border-radius:10px;aspect-ratio:16/9;object-fit:cover}
.proj h3{font-size:1.4rem;margin:0}
.proj .more{display:none;padding-left:20px;color:var(--muted);font-size:.96rem}
.proj.open .more{display:block}
.proj .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;align-items:center}
.link-btn{background:none;border:none;color:var(--accent);font:600 .95rem var(--body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}

/* TIMELINE (experience + education) */
.timeline{list-style:none;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 34px 28px}
.timeline li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.timeline h3{font-size:1.25rem}
.timeline .when{font-size:.9rem;color:var(--muted);font-weight:500;margin:2px 0 8px}
.timeline ul{padding-left:18px;color:var(--muted);font-size:.97rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:56px}

/* ACHIEVEMENTS */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cert h3{font-size:1.1rem;margin-bottom:6px}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
.contact-grid .big{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;line-height:1.15;margin-bottom:16px}
form{display:grid;gap:14px}
label{font-weight:600;font-size:.92rem;display:grid;gap:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:130px;resize:vertical}
.note{font-size:.85rem;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:36px 0}
.foot{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.foot nav,.foot .fs{display:flex;gap:16px;flex-wrap:wrap;height:auto}
.foot a{text-decoration:none;color:var(--muted);font-size:.93rem}
.foot a:hover{color:var(--ink)}
#toTop{position:fixed;right:20px;bottom:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toTop.show{opacity:1;pointer-events:auto}

.reveal{opacity:0;transition:opacity .7s ease}
.reveal.in{opacity:1}
.hidden{display:none!important}

@media (max-width:820px){
  #menuBtn{display:grid}
  .links{position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px 20px;display:none}
  .links.open{display:flex}
  .two-col,.contact-grid{grid-template-columns:1fr;gap:40px}
  section{padding:64px 0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
  .reveal{opacity:1}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav aria-label="Main">
      <a href="#home" class="logo" id="logo"></a>
      <ul class="links" id="navLinks"></ul>
      <div class="tools">
        <a class="btn sm primary hidden" id="resumeBtn" target="_blank" rel="noopener">Resume</a>
        <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme" title="Switch theme"></button>
        <button class="icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="wrap">
      <img class="hero-photo hidden" id="photo" alt="">
      <h1 id="heroName"></h1>
      <p class="title" id="heroTitle"></p>
      <p class="intro" id="heroIntro"></p>
      <div class="cta" id="heroCta"></div>
      <div class="socials" id="heroSocials"></div>
    </div>
  </section>

  <section id="about" class="about hidden"><div class="wrap reveal">
    <h2>About</h2><div id="aboutBody"></div>
  </div></section>

  <section id="skills" class="hidden"><div class="wrap reveal">
    <h2>Skills</h2><div class="skill-grid" id="skillGrid"></div>
  </div></section>

  <section id="projects" class="hidden"><div class="wrap reveal">
    <h2>Projects</h2><div class="proj-grid" id="projGrid"></div>
  </div></section>

  <section id="experience" class="hidden"><div class="wrap reveal">
    <h2>Experience</h2><ul class="timeline" id="expList"></ul>
  </div></section>

  <section id="education" class="hidden"><div class="wrap reveal">
    <h2>Education</h2><ul class="timeline" id="eduList"></ul>
  </div></section>

  <section id="achievements" class="hidden"><div class="wrap reveal">
    <h2>Certifications &amp; achievements</h2>
    <div class="cert-grid" id="certGrid"></div>
    <ul class="timeline hidden" id="achList" style="margin-top:32px"></ul>
    <div id="pubBlock" class="hidden" style="margin-top:32px"></div>
  </div></section>

  <section id="contact"><div class="wrap reveal contact-grid">
    <div>
      <h2 style="margin-bottom:16px">Contact</h2>
      <p class="big" id="contactBig"></p>
      <p class="muted" id="contactLines"></p>
      <div class="socials" id="contactSocials"></div>
    </div>
    <form id="contactForm">
      <label>Your name <input name="name" required autocomplete="name"></label>
      <label>Your email <input type="email" name="email" required autocomplete="email"></label>
      <label>Message <textarea name="message" required></textarea></label>
      <button class="btn primary" type="submit">Send by email</button>
      <p class="note">This form opens your email app with the message filled in. There is no server behind it, so nothing is sent until you press send in your email app.</p>
    </form>
  </div></section>
</main>

<footer>
  <div class="wrap foot">
    <p class="muted" id="copy"></p>
    <nav id="footNav" aria-label="Footer"></nav>
    <div class="fs" id="footSocials"></div>
  </div>
</footer>
<button class="icon-btn" id="toTop" aria-label="Back to top">↑</button>

<script>
/* =====================================================================
   PORTFOLIO DATA – EDIT EVERYTHING ABOUT YOU IN THIS ONE OBJECT.
   Any empty value ("" or []) is hidden automatically. Nothing else in
   the file needs to change.
   ===================================================================== */
const portfolioData = {
  // EDIT YOUR NAME HERE
  name: "Alan Singh",
  title: "BCA graduate · Web developer",
  location: "Delhi NCR, India",
  email: "alansingh1037@gmail.com",
  phone: "",                  // optional – add if you want it public
  // UPDATE YOUR PROFILE IMAGE HERE (URL, or a data: URI to stay single-file)
  profileImage: "",
  // Link to a hosted copy of your resume PDF. Empty = Resume button hidden.
  resume: "",

  // ABOUT
  intro: "BCA graduate with web development and database experience, eager to learn, adapt, and contribute to impactful projects.",
  bio: "",                    // optional longer biography (separate paragraphs with a blank line)
  goal: "",                   // optional career goal
  interests: [],              // optional, e.g. ["Web development", "Databases"]

  // UPDATE YOUR SKILLS HERE (a category with no items is hidden)
  skills: {
    "Programming": ["Python", "Java", "C", "JavaScript", "HTML", "CSS"],
    "Web": ["Bootstrap", "REST APIs", "Responsive design"],
    "Databases": ["MySQL", "MongoDB"],
    "Tools": ["Git / GitHub", "VS Code", "Postman"],
    "Other": ["Firebase", "Cloud fundamentals (introductory)"],
    "General IT": ["MS Office", "Networking basics", "Windows OS"],
    "Soft skills": ["Problem-solving", "Adaptability", "Collaboration", "Communication"]
  },

  // ADD YOUR PROJECTS HERE (copy one block to add more)
  projects: [
    {
      name: "Medicine Website",
      description: "Responsive app for browsing and purchasing medicines.",
      tech: ["HTML", "CSS", "JavaScript", "Bootstrap", "Python", "SQL"],
      features: ["Browse and purchase medicines", "Shopping cart", "User login"],
      github: "",             // paste GitHub URL – button appears automatically
      demo: "",               // paste live demo URL – button appears automatically
      image: ""
    },
    {
      name: "Wedding Point",
      description: "Platform to book venues and order products, with an admin panel.",
      tech: ["Python", "SQL", "Bootstrap", "JavaScript"],
      features: ["Venue booking", "Product ordering", "Admin panel"],
      github: "",
      demo: "",
      image: ""
    }
  ],

  // EXPERIENCE (empty array hides the section)
  experience: [
    {
      role: "Web Development Intern",
      org: "Rockweb Technologies, Dehradun",
      period: "June 2024 – July 2024",
      points: [
        "Built a Report Card Management System using MongoDB and backend APIs.",
        "Developed responsive pages using HTML, CSS, JS and Bootstrap.",
        "Implemented authentication and optimized NoSQL queries."
      ]
    }
  ],

  // EDUCATION
  education: [
    { degree: "BCA", school: "Christ University, Delhi NCR", period: "Aug 2022 – June 2025", detail: "" },
    { degree: "Class XII – Commerce (without Mathematics)", school: "St. Francis School, Delhi NCR", period: "2021 – 2022", detail: "" },
    { degree: "Class X – Secondary education", school: "St. Francis School, Delhi NCR", period: "2019 – 2020", detail: "" }
  ],

  // CERTIFICATIONS, ACHIEVEMENTS, PUBLICATIONS
  certifications: [
    { name: "Cyber Security Essentials", issuer: "Coursera", year: "Nov 2023", link: "" },
    { name: "Full-Stack Web Development", issuer: "Udemy", year: "Aug 2023", link: "" },
    { name: "SQL for Data Science", issuer: "IBM SkillsBuild", year: "July 2023", link: "" }
  ],
  achievements: [],           // e.g. ["Won the college hackathon"]
  publications: [],           // e.g. [{ title:"", venue:"", year:"", link:"" }]

  // CHANGE YOUR SOCIAL LINKS HERE (empty = hidden)
  social: {
    LinkedIn: "https://linkedin.com/in/alan-singh-00ba9614a",
    GitHub: "",
    Twitter: "",
    Instagram: "",
    Website: ""
  }
};

/* ============================ RENDERING ============================ */
const d = portfolioData;
const $ = id => document.getElementById(id);
const has = v => Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext = 'target="_blank" rel="noopener"';

document.title = d.name + " – " + d.title;
$('logo').textContent = d.name;

/* Hero: name is split so each part sits on its own line */
const parts = d.name.trim().split(/\s+/);
$('heroName').innerHTML = esc(parts[0]) + (parts.length > 1 ? '<span>' + esc(parts.slice(1).join(' ')) + '</span>' : '');
$('heroTitle').textContent = d.title + (has(d.location) ? ' – ' + d.location : '');
if (has(d.intro)) $('heroIntro').textContent = d.intro; else $('heroIntro').classList.add('hidden');
if (has(d.profileImage)) { $('photo').src = d.profileImage; $('photo').alt = 'Portrait of ' + d.name; $('photo').classList.remove('hidden'); }
if (has(d.resume)) { $('resumeBtn').href = d.resume; $('resumeBtn').classList.remove('hidden'); }

const socialLinks = Object.entries(d.social).filter(([, u]) => has(u));
const socialHtml = socialLinks.map(([n, u]) => `<a href="${esc(u)}" ${ext}>${esc(n)}</a>`).join('');
$('heroSocials').innerHTML = socialHtml;
$('contactSocials').innerHTML = socialHtml;
$('footSocials').innerHTML = socialHtml;

const nav = [['home', 'Home', true]];
const cta = [];
if (has(d.projects)) cta.push('<a class="btn primary" href="#projects">See my projects</a>');
if (has(d.email)) cta.push(`<a class="btn" href="#contact">Get in touch</a>`);
$('heroCta').innerHTML = cta.join('');

/* About */
const aboutBits = [];
if (has(d.bio)) aboutBits.push(...d.bio.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`));
else if (has(d.intro)) aboutBits.push(`<p>${esc(d.intro)}</p>`);
if (has(d.goal)) aboutBits.push(`<p class="goal"><strong>Goal.</strong> ${esc(d.goal)}</p>`);
if (has(d.interests)) aboutBits.push(`<div class="chips" style="margin-top:20px">${d.interests.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>`);
if (has(d.bio) || has(d.goal) || has(d.interests)) { $('aboutBody').innerHTML = aboutBits.join(''); show('about', 'About'); }

/* Skills */
const cats = Object.entries(d.skills).filter(([, items]) => has(items));
if (cats.length) {
  $('skillGrid').innerHTML = cats.map(([c, items]) =>
    `<div class="card"><h3>${esc(c)}</h3><div class="chips">${items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('');
  show('skills', 'Skills');
}

/* Projects */
if (has(d.projects)) {
  $('projGrid').innerHTML = d.projects.map((p, i) => {
    const links = [has(p.github) ? `<a class="btn sm" href="${esc(p.github)}" ${ext}>GitHub</a>` : '',
                   has(p.demo) ? `<a class="btn sm primary" href="${esc(p.demo)}" ${ext}>Live demo</a>` : ''].join('');
    return `<article class="card proj">
      ${has(p.image) ? `<img src="${esc(p.image)}" alt="${esc(p.name)} screenshot" loading="lazy">` : ''}
      <h3>${esc(p.name)}</h3>
      <p class="muted">${esc(p.description)}</p>
      <div class="chips">${(p.tech || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
      ${has(p.features) ? `<ul class="more" id="more${i}">${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
      <div class="row">${has(p.features) ? `<button class="link-btn" data-more="${i}" aria-expanded="false" aria-controls="more${i}">Show features</button>` : ''}${links}</div>
    </article>`;
  }).join('');
  $('projGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-more]'); if (!b) return;
    const card = b.closest('.proj'); const open = card.classList.toggle('open');
    b.setAttribute('aria-expanded', open); b.textContent = open ? 'Hide features' : 'Show features';
  });
  show('projects', 'Projects');
}

/* Experience */
if (has(d.experience)) {
  $('expList').innerHTML = d.experience.map(x =>
    `<li><h3>${esc(x.role)}</h3><p class="when">${esc(x.org)}${has(x.period) ? ' · ' + esc(x.period) : ''}</p>${has(x.points) ? `<ul>${x.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}</li>`).join('');
  show('experience', 'Experience');
}

/* Education */
if (has(d.education)) {
  $('eduList').innerHTML = d.education.map(e =>
    `<li><h3>${esc(e.degree)}</h3><p class="when">${esc(e.school)}${has(e.period) ? ' · ' + esc(e.period) : ''}</p>${has(e.detail) ? `<p class="muted">${esc(e.detail)}</p>` : ''}</li>`).join('');
  show('education', 'Education');
}

/* Achievements, certifications, publications */
let anyAch = false;
if (has(d.certifications)) {
  $('certGrid').innerHTML = d.certifications.map(c => {
    const inner = `<h3>${esc(c.name)}</h3><p class="muted">${esc(c.issuer)}${has(c.year) ? ' · ' + esc(c.year) : ''}</p>`;
    return `<div class="card cert">${has(c.link) ? `<a href="${esc(c.link)}" ${ext} style="text-decoration:none">${inner}</a>` : inner}</div>`;
  }).join(''); anyAch = true;
}
if (has(d.achievements)) {
  $('achList').innerHTML = d.achievements.map(a => `<li><p>${esc(a)}</p></li>`).join('');
  $('achList').classList.remove('hidden'); anyAch = true;
}
if (has(d.publications)) {
  $('pubBlock').innerHTML = '<h3 style="margin-bottom:12px">Publications</h3>' + d.publications.map(p =>
    `<p>${has(p.link) ? `<a href="${esc(p.link)}" ${ext}>${esc(p.title)}</a>` : esc(p.title)} <span class="muted">– ${esc(p.venue || '')} ${esc(p.year || '')}</span></p>`).join('');
  $('pubBlock').classList.remove('hidden'); anyAch = true;
}
if (anyAch) show('achievements', 'Achievements');

/* Contact */
if (has(d.email)) {
  nav.push(['contact', 'Contact', true]);
  $('contactBig').textContent = 'Have a project or an opening in mind? Write to me.';
  $('contactLines').innerHTML = `<a href="mailto:${esc(d.email)}">${esc(d.email)}</a>` + (has(d.phone) ? `<br><a href="tel:${esc(d.phone.replace(/\s/g, ''))}">${esc(d.phone)}</a>` : '') + (has(d.location) ? `<br>${esc(d.location)}` : '');
  $('contactForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = `${f.get('message')}\n\n– ${f.get('name')} (${f.get('email')})`;
    location.href = `mailto:${d.email}?subject=${encodeURIComponent('Message from ' + f.get('name'))}&body=${encodeURIComponent(body)}`;
  });
} else { $('contact').classList.add('hidden'); }

/* Navigation (built only from sections that exist) */
function show(id, label) {
  $(id).classList.remove('hidden');
  nav.splice(nav.length - (nav.some(n => n[0] === 'contact') ? 1 : 0), 0, [id, label]);
}
const order = ['home', 'about', 'skills', 'projects', 'experience', 'education', 'achievements', 'contact'];
nav.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
$('navLinks').innerHTML = nav.map(([id, l]) => `<li><a href="#${id}" data-id="${id}">${l}</a></li>`).join('');
$('footNav').innerHTML = nav.map(([id, l]) => `<a href="#${id}">${l}</a>`).join('');
$('copy').textContent = `© ${new Date().getFullYear()} ${d.name}`;

/* Mobile menu */
const menuBtn = $('menuBtn'), links = $('navLinks');
menuBtn.addEventListener('click', () => {
  const open = links.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', open);
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
});
links.addEventListener('click', e => { if (e.target.closest('a')) { links.classList.remove('open'); menuBtn.setAttribute('aria-expanded', false); } });

/* Theme (saved in localStorage; falls back to system preference) */
const themeBtn = $('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀' : '☾';
  themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}
let saved = null;
try { saved = localStorage.getItem('theme'); } catch (e) {}
applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('theme', next); } catch (e) {}
});

/* Active nav highlight */
const navAnchors = [...document.querySelectorAll('#navLinks a')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) navAnchors.forEach(a => a.classList.toggle('active', a.dataset.id === en.target.id)); });
}, { rootMargin: '-45% 0px -50% 0px' });
nav.forEach(([id]) => spy.observe($(id)));

/* Scroll reveal (a gentle fade, once) */
const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rv.unobserve(e.target); } }), { threshold: .08 });
document.querySelectorAll('.reveal').forEach(el => rv.observe(el));

/* Back to top */
const toTop = $('toTop');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 600), { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0 }));
</script>
</body>
</html>
